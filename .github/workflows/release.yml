name: Release APK

# Builds a signed release APK and publishes it as a GitHub Release whenever
# a version tag (e.g. v1.0.3) is pushed. The in-app update checker
# (lib/services/update_service.dart) reads this repo's "latest release" to
# find new versions, so this workflow is how an update actually gets
# published for existing installs to pick up.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Install dependencies
        working-directory: food_link
        run: flutter pub get

      - name: Restore release keystore
        working-directory: food_link/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        working-directory: food_link
        run: flutter build apk --release

      - name: Rename APK for release
        run: cp food_link/build/app/outputs/flutter-apk/app-release.apk foodlink-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: foodlink-${{ github.ref_name }}.apk
          generate_release_notes: true
